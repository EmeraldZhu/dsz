name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  protocol:
    name: ds-proto tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p ds-proto --release --locked

  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --release --locked
      - name: Build release exe
        run: cargo build --release -p dsz --locked
      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash target\release\dsz.exe -Algorithm SHA256).Hash.ToLower()
          "$h  dsz.exe" | Out-File -Encoding ascii target\release\dsz.exe.sha256
          Write-Output "dsz.exe SHA-256: $h"
      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/release/dsz.exe
      - uses: actions/upload-artifact@v5
        with:
          name: dsz-${{ github.sha }}
          path: |
            target/release/dsz.exe
            target/release/dsz.exe.sha256
